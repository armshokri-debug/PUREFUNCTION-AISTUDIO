name: One-Time Isolated Encrypted Recovery Drill

on:
  push:
    branches:
      - qa/isolated-recovery-drill-20261121
    paths:
      - .github/workflows/isolated-recovery-drill.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: supabase/postgres:17.12.0.002
        env:
          POSTGRES_DB: restorecheck
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: local-restore-only
          PGPASSWORD: local-restore-only
          PGUSER: supabase_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d restorecheck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      BACKUP_GDRIVE_CLIENT_ID: ${{ secrets.BACKUP_GDRIVE_CLIENT_ID }}
      BACKUP_GDRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_GDRIVE_CLIENT_SECRET }}
      BACKUP_GDRIVE_REFRESH_TOKEN: ${{ secrets.BACKUP_GDRIVE_REFRESH_TOKEN }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_GDRIVE_FOLDER_NAME: PureFunction-Encrypted-Backups
      LOCAL_RESTORE_DB_URL: postgresql://supabase_admin:local-restore-only@127.0.0.1:5432/restorecheck?sslmode=disable
    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends -qq curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends -qq postgresql-client-17 postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_restore --version
      - name: Verify encrypted Drive backup and decrypt in ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const fs=require('node:fs');
          const path=require('node:path');
          const {pipeline}=require('node:stream/promises');
          const {Readable}=require('node:stream');
          const {execFileSync}=require('node:child_process');
          const {exchangeRefreshToken,listFolderFiles}=require('./scripts/backup/gdrive-storage.cjs');
          const {sha256File,decryptFile}=require('./scripts/backup/backup-lib.cjs');
          (async()=>{
            const keys=['BACKUP_GDRIVE_CLIENT_ID','BACKUP_GDRIVE_CLIENT_SECRET','BACKUP_GDRIVE_REFRESH_TOKEN','BACKUP_ENCRYPTION_KEY'];
            if(keys.some(k=>!process.env[k]))throw Error('Required secret missing');
            const token=await exchangeRefreshToken({clientId:process.env.BACKUP_GDRIVE_CLIENT_ID,clientSecret:process.env.BACKUP_GDRIVE_CLIENT_SECRET,refreshToken:process.env.BACKUP_GDRIVE_REFRESH_TOKEN});
            const q=new URLSearchParams({q:"name='PureFunction-Encrypted-Backups' and mimeType='application/vnd.google-apps.folder' and trashed=false",fields:'files(id,name)',pageSize:'10'});
            const foldersRes=await fetch('https://www.googleapis.com/drive/v3/files?'+q,{headers:{Authorization:'Bearer '+token}});
            if(!foldersRes.ok)throw Error('Backup folder search failed');
            const folders=(await foldersRes.json()).files||[];
            let files=[];
            for(const folder of folders)files.push(...await listFolderFiles({accessToken:token,folderId:folder.id}));
            const manifests=files.filter(f=>/^backup-[0-9TZ-]+\.manifest\.json$/.test(f.name)).sort((a,b)=>b.name.localeCompare(a.name));
            let pair;
            for(const mf of manifests){
              const stem=mf.name.replace(/\.manifest\.json$/,'');
              const enc=files.find(f=>f.name===stem+'.tar.gz.enc');
              if(enc){pair={mf,enc};break;}
            }
            if(!pair)throw Error('No matching encrypted backup found');
            const dir=path.join(process.env.RUNNER_TEMP,'pf-isolated-restore');
            fs.mkdirSync(dir,{recursive:true,mode:0o700});
            const download=async(id,out,max)=>{
              const r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?alt=media',{headers:{Authorization:'Bearer '+token}});
              if(!r.ok||!r.body)throw Error('Private backup download failed');
              let n=0;
              const limited=async function*(stream){for await(const part of stream){n+=part.length;if(n>max)throw Error('Backup size exceeds limit');yield part;}};
              await pipeline(Readable.fromWeb(r.body),limited,fs.createWriteStream(out,{mode:0o600}));
            };
            const mp=path.join(dir,'manifest.json'), ep=path.join(dir,'backup.enc'),tp=path.join(dir,'backup.tar.gz');
            await download(pair.mf.id,mp,1024*1024);
            const manifest=JSON.parse(fs.readFileSync(mp,'utf8'));
            if(manifest.projectRef!=='rugwzvztweiffprkxfdc'||manifest.archiveName!==pair.enc.name)throw Error('Backup identity mismatch');
            await download(pair.enc.id,ep,2*1024*1024*1024);
            if(await sha256File(ep)!==manifest.encryptedArchiveSha256)throw Error('Encrypted backup hash mismatch');
            console.log('PASS: Encrypted backup verified against Drive manifest');
            await decryptFile(ep,tp,process.env.BACKUP_ENCRYPTION_KEY);
            if(await sha256File(tp)!==manifest.plaintextArchiveSha256)throw Error('Decrypted backup hash mismatch');
            const listing=execFileSync('tar',['-tzf',tp],{encoding:'utf8'}).split('\n').filter(Boolean);
            const safe=listing.every(x=>!x.startsWith('/')&&!x.split('/').includes('..'));
            if(!safe)throw Error('Unsafe tar archive paths');
            const required=['db/public-private-full.dump','db/auth-full.dump','db/storage-schema-full.dump','db/supabase-migrations.dump'];
            if(required.some(x=>!listing.includes(x)&&!listing.includes('./'+x)))throw Error('Archive lacks recovery components');
            execFileSync('tar',['-xzf',tp,'-C',dir,'--no-same-owner','--no-same-permissions'],{stdio:'ignore'});
            console.log('PASS: Backup decrypted and required recovery components validated');
          })().catch(e=>{console.error('FAILED: Isolated recovery preflight ('+e.message.replace(/[\r\n]/g,' ').slice(0,120)+')');process.exitCode=1;});
          NODE
      - name: Restore database into ephemeral PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$LOCAL_RESTORE_DB_URL" != postgresql://supabase_admin:*@127.0.0.1:5432/restorecheck\?sslmode=disable ]]; then
            echo 'BLOCKED: Non-local database target'; exit 1
          fi
          psql "$LOCAL_RESTORE_DB_URL" -X -v ON_ERROR_STOP=1 >/dev/null <<'SQL'
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE SCHEMA IF NOT EXISTS private;
          CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA extensions;
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          DO $$
          DECLARE role_name text;
          BEGIN
            FOREACH role_name IN ARRAY ARRAY['anon','authenticated','service_role','supabase_admin','supabase_auth_admin','supabase_storage_admin','dashboard_user','authenticator','pgbouncer','supabase_replication_admin']
            LOOP
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname=role_name) THEN
                EXECUTE format('CREATE ROLE %I NOLOGIN',role_name);
              END IF;
            END LOOP;
          END $$;
          SQL
          restore_phase() {
            local name="$1" section="$2"
            local archive="$RUNNER_TEMP/pf-isolated-restore/db/$name.dump"
            local flags=(--no-owner --no-acl --exit-on-error --single-transaction "--section=$section")
            if [[ "$section" == "pre-data" && "$name" == "public-private-full" ]]; then
              # The Supabase PostgreSQL image owns the 'public' schema; do not drop it.
              /usr/lib/postgresql/18/bin/pg_restore -l "$archive" > "$RUNNER_TEMP/restore-list.txt"
              sed -i '/^[0-9][0-9]*;.* SCHEMA - \(public\|private\) /d' "$RUNNER_TEMP/restore-list.txt"
              flags+=(--use-list "$RUNNER_TEMP/restore-list.txt")
            elif [[ "$section" == "pre-data" ]]; then
              flags+=(--clean --if-exists)
            fi
            if /usr/lib/postgresql/18/bin/pg_restore --dbname="$LOCAL_RESTORE_DB_URL" "${flags[@]}" "$archive" >/dev/null 2>"$RUNNER_TEMP/restore-error.txt"; then
              echo "PASS: $name $section restored into isolated PostgreSQL 17"
              return 0
            fi
            if grep -qi 'role .* does not exist' "$RUNNER_TEMP/restore-error.txt"; then
              echo "BLOCKED: $name $section missing local role"
            elif grep -qi 'schema .* does not exist' "$RUNNER_TEMP/restore-error.txt"; then
              echo "BLOCKED: $name $section missing local schema"
            elif grep -qi 'function .* does not exist' "$RUNNER_TEMP/restore-error.txt"; then
              echo "BLOCKED: $name $section missing local function"
            elif grep -qi 'relation .* does not exist' "$RUNNER_TEMP/restore-error.txt"; then
              echo "BLOCKED: $name $section missing local table"
            elif grep -qi 'already exists' "$RUNNER_TEMP/restore-error.txt"; then
              echo "BLOCKED: $name $section local schema conflict"
            elif grep -qi 'extension .* is not available' "$RUNNER_TEMP/restore-error.txt"; then
              echo "BLOCKED: $name $section missing extension"
            else
              echo "BLOCKED: $name $section isolated restore dependency error"
              python3 -c 'import re,sys; s=open(sys.argv[1],errors="replace").read(); m=re.search(r"(?im)^(?:pg_restore: error:|ERROR:)\s*([^\n]+)",s); t=m.group(1) if m else "unknown"; t=re.sub(r"[\x22\x27][^\x22\x27]*[\x22\x27]|https?://\S+|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+","[redacted]",t); print("Safe restore error category: "+t[:90])' "$RUNNER_TEMP/restore-error.txt"
            fi
            return 1
          }
          restore_phase auth-full pre-data
          restore_phase public-private-full pre-data
          restore_phase storage-schema-full pre-data
          restore_phase auth-full data
          restore_phase public-private-full data
          restore_phase storage-schema-full data
          restore_phase auth-full post-data
          restore_phase public-private-full post-data
          restore_phase storage-schema-full post-data
          for section in pre-data data post-data; do
            restore_phase supabase-migrations "$section"
          done
          test "$(psql "$LOCAL_RESTORE_DB_URL" -X -tA -c "SELECT count(*)>0 FROM pg_catalog.pg_tables WHERE schemaname IN ('auth','storage','private');")" = t
          echo 'PASS: Full isolated database restore validated'
      - name: Securely clean ephemeral restored data
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/pf-isolated-restore" "$RUNNER_TEMP/restore-error.txt"
