name: Referral concurrency validation
on:
  pull_request:
    paths:
      - 'supabase/proposals/referral_concurrency_hardening.sql'
      - 'scripts/qa/referral-concurrency*'
      - '.github/workflows/referral-concurrency.yml'
permissions:
  contents: read
jobs:
  referral-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: referral_test
        options: >-
          --health-cmd "pg_isready -U postgres -d referral_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify referral races on disposable PostgreSQL
        env:
          PF_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 scripts/qa/referral-concurrency.py
