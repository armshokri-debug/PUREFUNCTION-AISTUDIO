# DISABLED BY DEFAULT until owner approval, secret configuration, and isolated validation.
#
# Activation checklist (see docs/BACKUP_AND_RECOVERY.md):
# 1. Provision a private external S3-compatible bucket (recommended: Cloudflare R2 free tier).
# 2. Configure the required GitHub Repository Secrets & Variables listed in docs/BACKUP_AND_RECOVERY.md.
# 3. Keep ENABLE_SUPABASE_BACKUP=false and run a manual "validate-only" check first.
# 4. Set repository variable ENABLE_SUPABASE_BACKUP=true only when ready for the first supervised backup.
# 5. Uncomment the `schedule:` block below ONLY after a real backup + isolated restore drill succeed.

name: Supabase Encrypted Backup (Disabled Until Approved)

on:
  # Intentionally commented out until configuration, approval, and first verified backup:
  # schedule:
  #   - cron: '0 9 * * *' # Daily 09:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode (use validate-only until secrets are configured and approved)'
        required: true
        default: 'validate-only'
        type: choice
        options:
          - validate-only
          - connectivity-only
          - first-drive-preflight
          - first-drive-backup
          - verify-first-drive-restore
          - live-backup
      confirm_live_backup:
        description: 'Type RUN_BACKUP for live-backup or FIRST_DRIVE_BACKUP for the approved first upload'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: supabase-encrypted-backup
  cancel-in-progress: false

jobs:
  verify-first-drive-restore:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'verify-first-drive-restore' && vars.ENABLE_SUPABASE_BACKUP == 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the first Drive backup without persisting decrypted data
        env:
          ENABLE_SUPABASE_BACKUP: ${{ vars.ENABLE_SUPABASE_BACKUP }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_GDRIVE_CLIENT_ID: ${{ secrets.BACKUP_GDRIVE_CLIENT_ID }}
          BACKUP_GDRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_GDRIVE_CLIENT_SECRET }}
          BACKUP_GDRIVE_REFRESH_TOKEN: ${{ secrets.BACKUP_GDRIVE_REFRESH_TOKEN }}
          BACKUP_GDRIVE_FOLDER_ID: ${{ vars.BACKUP_GDRIVE_FOLDER_ID }}
        run: node scripts/backup/verify-first-drive-restore.cjs

  # Safe non-destructive validation job (no database, Storage, or S3 calls)
  validate-backup-tooling:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'validate-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Run non-destructive backup unit & safety tests
        run: npx vitest run scripts/backup/backup.test.mjs
      - name: Verify configured backup secrets/variables without touching production
        env:
          ENABLE_SUPABASE_BACKUP: ${{ vars.ENABLE_SUPABASE_BACKUP }}
          BACKUP_STORAGE_PROVIDER: ${{ vars.BACKUP_STORAGE_PROVIDER }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_GDRIVE_CLIENT_ID: ${{ secrets.BACKUP_GDRIVE_CLIENT_ID }}
          BACKUP_GDRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_GDRIVE_CLIENT_SECRET }}
          BACKUP_GDRIVE_REFRESH_TOKEN: ${{ secrets.BACKUP_GDRIVE_REFRESH_TOKEN }}
          BACKUP_GDRIVE_FOLDER_ID: ${{ vars.BACKUP_GDRIVE_FOLDER_ID }}
          BACKUP_GDRIVE_FOLDER_NAME: ${{ vars.BACKUP_GDRIVE_FOLDER_NAME }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
          BACKUP_MIN_KEEP_COUNT: ${{ vars.BACKUP_MIN_KEEP_COUNT }}
        run: node scripts/backup/run-backup.cjs --validate-only

  check-backup-connectivity:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'connectivity-only' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure the PostgreSQL client is installed
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
      - name: Test read-only connectivity with synthetic responses
        run: node --test scripts/backup/connectivity.check.cjs
      - name: Verify read-only service connectivity
        env:
          ENABLE_SUPABASE_BACKUP: ${{ vars.ENABLE_SUPABASE_BACKUP }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_GDRIVE_CLIENT_ID: ${{ secrets.BACKUP_GDRIVE_CLIENT_ID }}
          BACKUP_GDRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_GDRIVE_CLIENT_SECRET }}
          BACKUP_GDRIVE_REFRESH_TOKEN: ${{ secrets.BACKUP_GDRIVE_REFRESH_TOKEN }}
        run: node scripts/backup/check-connectivity.cjs

  # Live read-only encrypted backup job — gated behind BOTH vars.ENABLE_SUPABASE_BACKUP == 'true'
  # AND explicit manual confirmation (or future approved schedule).
  run-encrypted-backup:
    if: >-
      (
        vars.ENABLE_SUPABASE_BACKUP == 'true' &&
        (
          github.event_name == 'schedule' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.mode == 'live-backup' &&
            inputs.confirm_live_backup == 'RUN_BACKUP'
          )
        )
      ) ||
      (
        vars.ENABLE_SUPABASE_BACKUP == 'false' &&
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.mode == 'first-drive-preflight' ||
          (inputs.mode == 'first-drive-backup' && inputs.confirm_live_backup == 'FIRST_DRIVE_BACKUP')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PostgreSQL 17 client tools (read-only pg_dump / psql)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_bin=/usr/lib/postgresql/17/bin
          "$pg_bin/pg_dump" --version
          echo "$pg_bin" >> "$GITHUB_PATH"

      - name: Execute read-only encrypted backup to configured external storage (S3 or Google Drive)
        id: backup
        env:
          BACKUP_RUN_MODE: ${{ inputs.mode }}
          ENABLE_SUPABASE_BACKUP: ${{ vars.ENABLE_SUPABASE_BACKUP }}
          BACKUP_STORAGE_PROVIDER: ${{ vars.BACKUP_STORAGE_PROVIDER }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_GDRIVE_CLIENT_ID: ${{ secrets.BACKUP_GDRIVE_CLIENT_ID }}
          BACKUP_GDRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_GDRIVE_CLIENT_SECRET }}
          BACKUP_GDRIVE_REFRESH_TOKEN: ${{ secrets.BACKUP_GDRIVE_REFRESH_TOKEN }}
          BACKUP_GDRIVE_FOLDER_ID: ${{ vars.BACKUP_GDRIVE_FOLDER_ID }}
          BACKUP_GDRIVE_FOLDER_NAME: ${{ vars.BACKUP_GDRIVE_FOLDER_NAME }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
          BACKUP_MIN_KEEP_COUNT: ${{ vars.BACKUP_MIN_KEEP_COUNT }}
        run: |
          case "$BACKUP_RUN_MODE" in
            first-drive-preflight) node scripts/backup/run-backup.cjs --first-drive-preflight ;;
            first-drive-backup) node scripts/backup/run-backup.cjs --first-drive-backup ;;
            *) node scripts/backup/run-backup.cjs --confirm-live ;;
          esac

      - name: Report backup failure via GitHub Issue (zero secrets, zero PII)
        if: failure() && inputs.mode != 'first-drive-preflight' && inputs.mode != 'first-drive-backup'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = '[Backup Alert] Supabase encrypted backup failed';
            const body = [
              'The automated Pure Function Supabase backup workflow failed.',
              '',
              `- Workflow run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\``,
              `- Timestamp (UTC): ${new Date().toISOString()}`,
              '',
              'Review the workflow logs in GitHub Actions. No secrets or private client data are included in this alert.'
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backup-alert',
              per_page: 5
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['backup-alert']
              });
            }
