name: Nutrition reference audit
on:
  pull_request:
    paths:
      - 'src/data/localFoods.ts'
      - 'src/lib/localNutrition.ts'
      - 'scripts/nutrition/**'
      - '.github/workflows/nutrition-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/nutrition/audit_usda.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nutrition-reference-audit
          path: nutrition-audit/
          retention-days: 7
          if-no-files-found: warn
